[package]
name = "earshot"
version = "1.1.0"
description = "Earshot: guess songs from your own playlists"
edition = "2021"
license = "MIT"
default-run = "earshot"

[lib]
name = "earshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
